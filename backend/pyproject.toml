[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle・pyflakes、I: import 順、UP: 新しい構文への置換、B: bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# プロジェクトをパッケージとしてインストールしていないため、backend/ を import 元に加える
pythonpath = ["."]
